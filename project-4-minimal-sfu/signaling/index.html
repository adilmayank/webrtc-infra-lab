<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal SFU - Audio/Video Room</title>
  <style>
    :root {
      --bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --text: #333;
      --text-muted: #666;
      --accent: #6c63ff;
      --accent-hover: #574fd6;
      --success: #4caf80;
      --error: #e57373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ─── Top bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      background: var(--bg);
      box-shadow:
        3px 3px 6px var(--shadow-dark),
        -3px -3px 6px var(--shadow-light);
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s ease;
    }

    .chip.connected .dot {
      background: var(--success);
    }

    .chip.connected {
      color: var(--success);
    }

    .chip.error .dot {
      background: var(--error);
    }

    .chip.error {
      color: var(--error);
    }

    /* ─── Join overlay ─── */
    .join-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .join-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .join-card {
      background: var(--bg);
      border-radius: 24px;
      padding: 40px;
      box-shadow:
        10px 10px 20px var(--shadow-dark),
        -10px -10px 20px var(--shadow-light);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .join-card h2 {
      font-size: 1.4rem;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .join-card input[type="text"] {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      outline: none;
      margin-bottom: 20px;
      text-align: center;
    }

    .join-card input[type="text"]:focus {
      box-shadow:
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light);
    }

    .join-card button {
      width: 100%;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow:
        5px 5px 10px var(--shadow-dark),
        -5px -5px 10px var(--shadow-light);
      transition: all 0.15s ease;
    }

    .join-card button:hover {
      background: var(--accent-hover);
      box-shadow:
        3px 3px 6px var(--shadow-dark),
        -3px -3px 6px var(--shadow-light);
    }

    .join-card button:active {
      box-shadow:
        inset 3px 3px 6px rgba(0, 0, 0, 0.25),
        inset -3px -3px 6px rgba(255, 255, 255, 0.1);
    }

    .join-card button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ─── Main video grid (Google Meet style) ─── */
    .main-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    .video-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 100%;
    }

    /* Dynamic grid sizing based on participant count */
    .video-grid[data-count="0"],
    .video-grid[data-count="1"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .video-grid[data-count="2"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    .video-grid[data-count="3"],
    .video-grid[data-count="4"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .video-grid[data-count="5"],
    .video-grid[data-count="6"] {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .video-tile {
      border-radius: 16px;
      background: #d4d9e2;
      box-shadow:
        4px 4px 8px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }

    .video-tile .tile-label {
      position: absolute;
      bottom: 10px;
      left: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    /* ─── Local video PiP (bottom-right) ─── */
    .local-pip {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 180px;
      height: 135px;
      border-radius: 14px;
      overflow: hidden;
      background: #d4d9e2;
      box-shadow:
        6px 6px 12px var(--shadow-dark),
        -6px -6px 12px var(--shadow-light);
      z-index: 50;
      cursor: grab;
    }

    .local-pip video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .local-pip .pip-label {
      position: absolute;
      bottom: 6px;
      left: 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* ─── Bottom toolbar ─── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      flex-shrink: 0;
    }

    .toolbar button {
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--bg);
      color: var(--accent);
      cursor: pointer;
      box-shadow:
        4px 4px 8px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
      transition: all 0.15s ease;
    }

    .toolbar button:hover {
      box-shadow:
        2px 2px 4px var(--shadow-dark),
        -2px -2px 4px var(--shadow-light);
    }

    .toolbar button:active {
      box-shadow:
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light);
    }

    .toolbar .layer-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }
  </style>
</head>

<body>
  <!-- Join overlay -->
  <div id="joinOverlay" class="join-overlay">
    <div class="join-card">
      <h2>Join Room</h2>
      <input id="roomInput" type="text" placeholder="Room name" value="test-room" />
      <button id="joinBtn" onclick="join()">Join</button>
    </div>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <h1>Minimal SFU</h1>
    <div id="statusChip" class="chip">
      <span class="dot"></span>
      <span id="statusText">Not connected</span>
    </div>
  </div>

  <!-- Main remote video area -->
  <div class="main-area">
    <div id="remoteGrid" class="video-grid" data-count="0">
      <div class="empty-state">Waiting for participants...</div>
    </div>
  </div>

  <!-- Local video PiP -->
  <div id="localPip" class="local-pip" style="display:none;">
    <span class="pip-label">You</span>
  </div>

  <!-- Bottom toolbar (simulcast layer controls) -->
  <div id="toolbar" class="toolbar" style="display:none;">
    <button onclick="switchLayer('h')">High</button>
    <button onclick="switchLayer('m')">Med</button>
    <button onclick="switchLayer('l')">Low</button>
    <span class="layer-label" id="currentLayer">Layer: high</span>
  </div>

  <script>
    let ws;
    let pc;
    const peerId = 'peer-' + Math.random().toString(36).substr(2, 8);
    let candidateBuffer = [];
    let remoteCount = 0;

    function setStatus(text, state) {
      const chip = document.getElementById('statusChip');
      const label = document.getElementById('statusText');
      label.textContent = text;
      chip.className = 'chip' + (state ? ' ' + state : '');
    }

    function updateGridCount() {
      const grid = document.getElementById('remoteGrid');
      grid.setAttribute('data-count', remoteCount);
    }

    async function flushCandidates() {
      while (candidateBuffer.length > 0) {
        const c = candidateBuffer.shift();
        await pc.addIceCandidate(c);
      }
    }

    function switchLayer(layer) {
      ws.send(JSON.stringify({
        type: 'switchLayer',
        targetPeerId: '*',
        layer: layer
      }));
      const labels = { h: 'high', m: 'medium', l: 'low' };
      document.getElementById('currentLayer').textContent = 'Layer: ' + labels[layer];
    }

    async function join() {
      const roomId = document.getElementById('roomInput').value.trim();
      if (!roomId) {
        alert('Enter a room name');
        return;
      }

      document.getElementById('joinBtn').disabled = true;
      setStatus('Connecting...');

      ws = new WebSocket('ws://' + window.location.host + '/ws');

      ws.onopen = async () => {
        setStatus('Connected', 'connected');

        // Hide join overlay
        document.getElementById('joinOverlay').classList.add('hidden');

        pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            ws.send(JSON.stringify({
              type: 'candidate',
              candidate: event.candidate
            }));
          }
        };

        pc.ontrack = (event) => {
          console.log('Received remote track:', event.track.kind, event.track.id);
          const grid = document.getElementById('remoteGrid');

          // Remove empty state message if present
          const emptyState = grid.querySelector('.empty-state');
          if (emptyState) emptyState.remove();

          if (event.track.kind === 'video') {
            const tile = document.createElement('div');
            tile.className = 'video-tile';
            tile.setAttribute('data-stream-id', event.streams[0].id);

            const video = document.createElement('video');
            video.srcObject = event.streams[0];
            video.autoplay = true;
            video.muted = false;
            tile.appendChild(video);

            const label = document.createElement('span');
            label.className = 'tile-label';
            label.textContent = 'Participant';
            tile.appendChild(label);

            grid.appendChild(tile);
            remoteCount++;
            updateGridCount();
          } else {
            // Audio-only — attach hidden audio element
            const audio = document.createElement('audio');
            audio.srcObject = event.streams[0];
            audio.autoplay = true;
            grid.appendChild(audio);
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'connected') {
            setStatus('Connected', 'connected');
            document.getElementById('toolbar').style.display = 'flex';
          } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
            setStatus('Disconnected', 'error');
          }
        };

        // Get local media
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }
          });

          const audioTrack = stream.getAudioTracks()[0];
          if (audioTrack) {
            pc.addTrack(audioTrack, stream);
          }

          const videoTrack = stream.getVideoTracks()[0];
          if (videoTrack) {
            pc.addTransceiver(videoTrack, {
              direction: 'sendrecv',
              streams: [stream],
              sendEncodings: [
                { rid: 'h', maxBitrate: 1000000, scaleResolutionDownBy: 1 },
                { rid: 'm', maxBitrate: 500000, scaleResolutionDownBy: 2 },
                { rid: 'l', maxBitrate: 150000, scaleResolutionDownBy: 4 },
              ]
            });
          }

          // Show local PiP
          const pip = document.getElementById('localPip');
          const localVid = document.createElement('video');
          localVid.srcObject = stream;
          localVid.autoplay = true;
          localVid.muted = true;
          pip.prepend(localVid);
          pip.style.display = 'block';
        } catch (err) {
          setStatus('Media denied: ' + err.message, 'error');
          return;
        }

        // Send join + offer
        ws.send(JSON.stringify({
          type: 'join',
          roomId: roomId,
          peerId: peerId
        }));

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        ws.send(JSON.stringify({
          type: 'offer',
          sdp: offer.sdp
        }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case 'answer':
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
            await flushCandidates();
            break;

          case 'offer':
            await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
            await flushCandidates();
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({
              type: 'answer',
              sdp: answer.sdp
            }));
            break;

          case 'candidate':
            if (!pc.remoteDescription) {
              candidateBuffer.push(msg.candidate);
            } else {
              await pc.addIceCandidate(msg.candidate);
            }
            break;
        }
      };

      ws.onclose = () => {
        setStatus('Disconnected', 'error');
      };

      ws.onerror = (err) => {
        setStatus('Error', 'error');
        console.error('WebSocket error:', err);
      };
    }
  </script>
</body>

</html>
